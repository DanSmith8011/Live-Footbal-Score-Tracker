<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Nav Bar -->
    <header>
      <nav>
        <a href="#" id="matches">Matches</a>
      </nav>
    </header>
    
   <main id="list-view" class="dashboard-view">
    <!-- Date Selector Bar -->
    <div class="date-control-bar">
        <label for="match-date">Matchday:</label>
        <input type="date" id="match-date" value="2024-08-16"> <!-- Updated to match your 2024 season! -->
        <button id="load-fixtures-btn">Load Games</button>
    </div>

    <!-- Empty Grid Container for Fixture Cards -->
    <div id="fixtures-container" class="fixtures-grid">
        <!-- Cards will dynamically inject here later -->
    </div>
</main>

   <main id="detail-view" class="hidden">
    <button id="back-btn">← Back to Fixtures</button>
    
    <!-- Header container where your first helper function injects data -->
    <div id="match-header-container"></div>

    <!-- Navigation tabs -->
    <nav id="stats-lineup-nav" class="view-tabs">
        <button id="events-button" class="active">Events</button>
        <button id="stats-button">Stats</button>
        <button id="lineups-button">Lineups</button>
    </nav>

    <!-- Dynamic content container for stats, events, or lineups -->
    <div id="match-content-container"></div>
</main>
    
    <script src="app.js"></script>
    <script src="config.js"></script>
  </body>
</html>
